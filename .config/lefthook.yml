# lefthook.yml — Git hook pipeline
# https://github.com/evilmartians/lefthook
#
# Pipeline: format (auto-fix) → lint (check) → security (scan)
# Install: lefthook install

pre-commit:
  jobs:
    # === Job 1: Format ===
    # Auto-fix formatting issues before linting sees the code
    - name: format
      group:
        parallel: true
        jobs:
          - name: biome-format
            glob: "*.{ts,tsx,js,jsx,json,jsonc}"
            run: bunx @biomejs/biome format --write {staged_files}
            stage_fixed: true

          - name: prettier
            glob: "*.{yaml,yml,md,html,css,scss,graphql,sql,xml,svg}"
            run: prettier --config .config/prettierrc.json --write {staged_files}
            stage_fixed: true

          - name: taplo
            glob: "*.toml"
            run: taplo format --config .config/taplo.toml {staged_files}
            stage_fixed: true

          - name: shfmt
            glob: "*.{sh,bash,zsh}"
            run: shfmt -w -i 2 -ci -bn {staged_files}
            stage_fixed: true

          - name: dockfmt
            glob: "Dockerfile*"
            run: dockfmt fmt {staged_files}
            stage_fixed: true

    # === Job 2: Lint ===
    # Check formatted code for issues
    - name: lint
      exclude:
        - .beads/**
        - .claude/**
      group:
        parallel: true
        jobs:
          - name: biome-check
            glob: "*.{ts,tsx,js,jsx,json,jsonc}"
            run: bunx @biomejs/biome check {staged_files}

          - name: typecheck
            glob: "*.{ts,tsx}"
            run: bunx tsc --noEmit

          - name: yamllint
            glob: "*.{yaml,yml}"
            run: yamllint -c .config/yamllint.yml {staged_files}

          - name: markdownlint
            glob: "*.md"
            run: markdownlint-cli2 --fix --config .config/.markdownlint-cli2.jsonc {staged_files}
            stage_fixed: true

          - name: shellcheck
            glob: "*.{sh,bash}"
            run: shellcheck {staged_files}

          - name: taplo-lint
            glob: "*.toml"
            run: taplo lint --config .config/taplo.toml {staged_files}

          - name: hadolint
            glob: "Dockerfile*"
            run: hadolint --config .config/hadolint.yaml {staged_files}

          - name: actionlint
            glob: ".github/workflows/*.{yaml,yml}"
            run: actionlint {staged_files}

    # === Job 3: Security ===
    # Scan for secrets and credentials
    - name: security
      group:
        parallel: true
        jobs:
          - name: gitleaks
            run: gitleaks protect --staged --no-banner --config .config/gitleaks.toml

pre-push:
  jobs:
    - name: quality
      group:
        parallel: true
        jobs:
          - name: unit-tests
            glob: "*.{test,spec}.{ts,tsx,js,jsx}"
            run: bun test

          - name: type-check
            glob: "*.{ts,tsx}"
            run: bunx tsc --noEmit

          - name: lint
            run: bunx @biomejs/biome check .

commit-msg:
  commands:
    gitfluff:
      run: gitfluff lint {1}
