[tools]
bun = "1.3.11"
lefthook = "latest"
shellcheck = "latest"
shfmt = "latest"
actionlint = "latest"
gitleaks = "latest"
prettier = "latest"
markdownlint-cli2 = "latest"
yamllint = "latest"
taplo = "latest"
"pipx:gitfluff" = "latest"
hadolint = "latest"
"aqua:jessfraz/dockfmt" = "latest"

[tasks.dev]
description = "Run server in stdio mode"
run = "bun run src/index.ts"

[tasks.dev-http]
description = "Run server in HTTP mode on port 3001"
env = { MCP_TRANSPORT = "http", MCP_HTTP_PORT = "3001" }
run = "bun run src/index.ts"

[tasks.test]
description = "Run all tests with bun:test"
run = "bun test"

[tasks.typecheck]
description = "Type-check with tsc --noEmit"
run = "bunx tsc --noEmit"

[tasks.lint]
description = "Check code with Biome"
run = "bunx @biomejs/biome check --config-path .config ."

[tasks.lint-fix]
description = "Fix lint issues with Biome"
run = "bunx @biomejs/biome check --config-path .config --fix ."

[tasks.inspect]
description = "Open MCP Inspector for interactive testing"
run = "bunx @modelcontextprotocol/inspector bun run src/index.ts"
